name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e  # v1
    - name: set up JDK 1.8
      uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56  # v1
      with:
        java-version: 1.8
